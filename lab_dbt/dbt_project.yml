name: 'lab_dbt'
version: '1.0.0'

profile: 'lab_dbt'


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


models:
  lab_dbt:
    +persist_docs:
      relation: true
      columns: true
    +materialized: view
    bronze:
      +materialized: view
    silver:
      +materialized: view
    gold:
      +materialized: table